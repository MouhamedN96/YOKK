# Yaatal Engine — Cargo workspace config
#
# Fixes two Windows-specific issues:
#
# 1. libsql-ffi build.rs requires `cp` (Unix command) — Git for Windows
#    ships it at C:\Program Files\Git\usr\bin\cp.exe.
#
# 2. OneDrive-backed paths cause permission errors during builds —
#    redirect build outputs to %TEMP%.

[env]
# Prepend Git's Unix tools to PATH so libsql-ffi's build.rs can find `cp`
PATH = { value = "C:\\Program Files\\Git\\usr\\bin;${PATH}", force = true, relative = false }

[build]
# Move build artifacts out of OneDrive to avoid sync-lock conflicts
target-dir = "C:\\Users\\momo-\\AppData\\Local\\Temp\\yaatal-target"
